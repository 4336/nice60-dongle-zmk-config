# nice!60 동글 (nice!nano v2 / nRF52840) 설정
# USB HID 출력은 nice_nano/nrf52840/zmk 보드에서 기본 활성화됨

# ── 절전 설정 (배터리 내장 시 권장) ──────────────────────────
# 비활성 후 슬립 진입 타임아웃 (단위: ms)
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000   # 15분

# ── BLE 연결 안정성 ──────────────────────────────────────────
# peripheral(nice!60)과의 연결 유지를 위한 파라미터
# (기본값으로도 충분하나 연결이 불안정하면 조정)
# CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
# CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# ── ZMK Studio 지원 (선택사항) ───────────────────────────────
# 웹 기반 키맵 편집기 활성화 (USB 연결 시 사용)
# CONFIG_ZMK_STUDIO=y
